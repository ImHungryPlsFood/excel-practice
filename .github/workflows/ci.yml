# CI 품질 게이트 (TEST_STRATEGY Q-08, THREAT_MODEL S-10/S-11).
# test:rules(CARD-06C)와 test:e2e(CARD-03D 이후)는 해당 카드에서 단계를 추가한다.
# verify-content(CARD-04E)는 콘텐츠의 정답·오답·허용 작업이 하나라도 틀리면 빌드를 막는다.
# 서드파티 액션은 공급망 보호를 위해 커밋 SHA로 고정한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify-content
      - run: npm test
      - run: npm run audit:licenses
      - run: npm run audit:deps
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
